<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Can I Afford It?</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Can I Afford It" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <img src="images/logo.png" alt="Can I Afford It" class="brand-logo" width="1106" height="1006" />
      <h1 class="sr-only">Can I Afford It?</h1>
      <p class="app-subtitle">Triff smarte Kaufentscheidungen</p>

      <div id="message" class="message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-Mail</label>
          <input type="email" id="login-email" placeholder="du@beispiel.de" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Passwort</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Anmelden</button>
        <button type="button" class="btn-link" id="forgot-password-link">Passwort vergessen?</button>
      </form>

      <form id="register-form" class="hidden">
        <div class="form-group">
          <label for="register-name">Name</label>
          <input type="text" id="register-name" placeholder="Dein Name" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="register-email">E-Mail</label>
          <input type="email" id="register-email" placeholder="du@beispiel.de" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="register-password">Passwort</label>
          <input type="password" id="register-password" placeholder="Mind. 6 Zeichen" required minlength="6" autocomplete="new-password" />
        </div>
        <label class="consent"><input type="checkbox" id="register-consent" required /><span>Ich akzeptiere die <a href="agb.html" target="_blank" rel="noopener">AGB</a> und habe die <a href="datenschutz.html" target="_blank" rel="noopener">Datenschutzerklärung</a> gelesen.</span></label>
        <button type="submit" class="btn btn-primary" id="register-btn">Konto erstellen</button>
      </form>

      <form id="forgot-form" class="hidden">
        <div class="form-group">
          <label for="forgot-email">E-Mail</label>
          <input type="email" id="forgot-email" placeholder="du@beispiel.de" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary" id="forgot-btn">Reset-Link senden</button>
        <button type="button" class="btn-link" id="back-to-login-link">Zurück zum Login</button>
      </form>

      <div class="toggle-text" id="toggle-text">
        Noch kein Konto? <button type="button" id="show-register">Registrieren</button>
      </div>

      <div class="text-center" style="margin-top:24px;font-size:12px;">
        <a href="impressum.html" style="color:var(--color-text-secondary);margin-right:12px;">Impressum</a>
        <a href="datenschutz.html" style="color:var(--color-text-secondary);">Datenschutz</a>
        <a href="agb.html" style="color:var(--color-text-secondary);margin-left:12px;">AGB</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
