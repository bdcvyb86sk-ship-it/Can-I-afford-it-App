<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Neues Passwort – Can I Afford It?</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <img src="images/logo.png" alt="Can I Afford It" class="brand-logo brand-logo-sm" width="1106" height="1006" />
      <h1 class="text-center" style="font-size:24px;margin-bottom:6px;">Neues Passwort</h1>
      <p class="app-subtitle" id="reset-info">Link wird geprüft…</p>
      <div id="message" class="message"></div>

      <form id="reset-form" class="hidden">
        <div class="form-group">
          <label for="new-password">Neues Passwort</label>
          <input type="password" id="new-password" placeholder="Mind. 6 Zeichen" minlength="6" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="new-password2">Passwort wiederholen</label>
          <input type="password" id="new-password2" placeholder="Passwort wiederholen" minlength="6" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="reset-btn">Passwort speichern</button>
      </form>

      <a href="index.html" class="btn btn-secondary">Zurück zum Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
